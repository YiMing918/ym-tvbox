name: Update TVBox config

on:
  schedule:
    # 21:30 UTC = 05:30 Beijing time, daily
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, probe and merge sources
        run: python merge.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- peter_tvbox_pro.json; then
            echo "No changes in merged config."
          else
            git add peter_tvbox_pro.json
            git commit -m "Auto-update merged TVBox config"
            git push
          fi
