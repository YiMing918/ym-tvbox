name: Pure-function tests

# 只跑 merge.py 纯函数测试，不碰现有的合并 workflow（update.yml）。
# paths 过滤：每天机器人只改 peter_tvbox_pro.json 的提交不会触发，
# 只有 merge.py / tests / 本文件变动时才跑，不浪费 Actions 额度。
on:
  push:
    paths:
      - 'merge.py'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'merge.py'
      - 'tests/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run pure-function tests for merge.py
        run: python -m pytest tests/ -q
