name: Update TVBox config

on:
  schedule:
    # 21:30 UTC = 05:30 Beijing time, daily
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, probe and merge sources
        run: python merge.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- peter_tvbox_pro.json; then
            echo "No changes in merged config."
          else
            git add peter_tvbox_pro.json
            git commit -m "Auto-update merged TVBox config"
            git push
          fi

      - name: Purge jsDelivr cache（让 CDN 立即跟上新配置，失败不拦更新）
        if: always()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/YiMing918/ym-tvbox@main/peter_tvbox_pro.json" || true

      - name: 心跳保活（防 GitHub 60 天无活动停用定时任务）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 25 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git add .heartbeat
            git commit -m "heartbeat: 保活定时任务"
            git push
          else
            echo "仓库近期有活动，无需心跳提交"
          fi
